server {
    listen 443 ssl;
    server_name mtls.lab.local;

    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/ca.crt;   # кому доверяем для клиентов
    ssl_verify_client       on;
    ssl_verify_depth        2;

    location / {
        return 200 "hello, client DN: $ssl_client_s_dn, verify: $ssl_client_verify\n";
    }
}
