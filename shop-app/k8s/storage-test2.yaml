apiVersion: v1
kind: Pod
metadata:
  name: pvc-test2
spec:
  nodeSelector:
    kubernetes.io/hostname: multi
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "ls -la /data; cat /data/f; sleep 3600"]
      volumeMounts:
        - name: d
          mountPath: /data
  volumes:
    - name: d
      persistentVolumeClaim:
        claimName: pvc-test
