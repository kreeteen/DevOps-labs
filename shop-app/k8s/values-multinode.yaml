replicaCount: 4

image:
  repository: shop-app
  tag: "0.2"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: false

alerts:
  enabled: false
  errorRatioThreshold: 0.05

ingress:
  enabled: false
  className: nginx
  host: shop.lab.local
  clusterIssuer: lab-ca-issuer

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

pdb:
  enabled: true
  minAvailable: 1
