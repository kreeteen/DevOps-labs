replicaCount: 2

image:
  repository: shop-app
  tag: "0.2"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true

alerts:
  enabled: true
  errorRatioThreshold: 0.05
