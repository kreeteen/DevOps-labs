{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    release: kps
spec:
  groups:
    - name: shop-app.rules
      rules:
        - alert: ShopAppHighErrorRate
          expr: |
            sum(rate(app_requests_total{status="500",path!="/health"}[1m]))
            /
            sum(rate(app_requests_total{path!="/health"}[1m]))
            > {{ .Values.alerts.errorRatioThreshold }}
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Высокая доля ошибок в shop-app"
            description: "Доля 5xx: {{ "{{ $value | humanizePercentage }}" }}"
        - alert: ShopAppPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[10m]) > 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Под {{ "{{ $labels.pod }}" }} часто перезапускается"
{{- end }}
